name: Deploy Happy Coding to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check community.js
          node --check safety-ui.js
          node --check account-sync.js
          node --check account-entry.js
          node --check public-feed.js
          node --check sync-hook.js
          node --check ai-local.js
          node --input-type=module --check < account.js
          node --input-type=module --check < admin.js
          node --check desktop/main.js
          node --check desktop/preload.js
          node --check desktop/chrome.js
          node --check desktop/browser-core.js
          node --check desktop/download-core.js
      - name: Check offline behavior
        run: node --test tests/sw.test.cjs
      - name: Check desktop browser core
        run: node --test desktop/tests/*.test.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
