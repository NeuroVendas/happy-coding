name: Refresh desktop lock (temporary)
on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-preview.yml'
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Regenerate dependency lock only
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist refreshed lock to PR branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- desktop/package-lock.json
          $lockChanged = $LASTEXITCODE -ne 0
          $global:LASTEXITCODE = 0
          if (-not $lockChanged) {
            Write-Host 'Dependency lock already matches package metadata.'
            exit 0
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $branch = '${{ github.head_ref }}'
          $uri = 'https://api.github.com/repos/${{ github.repository }}/contents/desktop/package-lock.json'
          $meta = Invoke-RestMethod -Method Get -Uri "${uri}?ref=$([uri]::EscapeDataString($branch))" -Headers $headers
          $lock = Get-Content 'desktop/package-lock.json' -Raw
          $payload = @{
            message = 'build: lock Packager 20.0.1 security test'
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($lock))
            sha = $meta.sha
            branch = $branch
          } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          Write-Host 'Refreshed package-lock.json committed to PR branch.'
          $global:LASTEXITCODE = 0
