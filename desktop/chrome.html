<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Coding</title><style>*{box-sizing:border-box}body{margin:0;background:#10140e;color:#eef5e6;font-family:Inter,system-ui,sans-serif;overflow:hidden}.hidden{display:none!important}.bar{height:104px;padding:8px 10px 10px;border-bottom:1px solid #293221;display:flex;flex-direction:column;gap:8px}.tabs-row{display:flex;gap:7px;align-items:center;min-width:0}.brand{font-weight:800;color:#b7f34a;white-space:nowrap;padding:0 5px;font-size:12px}.tabs{display:flex;gap:6px;align-items:center;min-width:0;overflow:auto;scrollbar-width:none;flex:1}.tabs::-webkit-scrollbar{display:none}.tab{height:34px;min-width:145px;max-width:230px;background:#1b2217;border:1px solid #344129;border-radius:9px;color:#dce7d2;display:flex;align-items:center;overflow:hidden}.tab.active{border-color:#7da936;color:#b7f34a;background:#202919}.tab-main{border:0;background:transparent;color:inherit;min-width:0;flex:1;height:100%;padding:0 8px;text-align:left;display:flex;align-items:center;gap:7px}.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.loading{width:7px;height:7px;border-radius:50%;background:#b7f34a;opacity:.85;flex:none}.tab-close,.tab-tool{border:0;background:transparent;color:#98a58f;height:100%;padding:0 9px;font-size:16px}.tab-close:hover,.tab-tool:hover{color:#fff;background:#2b3526}.tab-tool{height:34px;width:36px;border:1px solid #344129;border-radius:9px}.nav{display:flex;gap:7px;height:42px}.nav button{width:38px;border:1px solid #344129;background:#192016;color:#dce7d2;border-radius:8px}.nav button:disabled{opacity:.35}.nav button.active{border-color:#7da936;color:#b7f34a;background:#202919}.nav form{flex:1;min-width:0}.nav input{width:100%;height:42px;border:1px solid #3a492d;border-radius:10px;background:#0d110c;color:#f0f6ea;padding:0 13px;outline:0}.nav input:focus{border-color:#b7f34a}.bookmark-toggle.saved{color:#b7f34a;border-color:#7da936}.download-toggle{position:relative;font-size:16px}.download-badge{position:absolute;right:-4px;top:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#b7f34a;color:#10140e;font-size:10px;font-weight:800;display:grid;place-items:center}.status{min-width:92px;max-width:180px;display:flex;align-items:center;justify-content:flex-end;color:#8f9d86;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.download-panel,.library-panel{height:256px;border-bottom:1px solid #293221;background:#121810;padding:10px 12px;overflow:hidden}.download-head,.library-head{height:34px;display:flex;align-items:center;gap:10px}.download-head h2,.library-head h2{margin:0;font-size:13px;color:#b7f34a}.download-head small,.library-head small{color:#84907e;flex:1}.download-head button,.library-head button,.library-tabs button{border:1px solid #344129;background:#192016;color:#dce7d2;border-radius:7px;padding:6px 9px}.library-tabs{display:flex;gap:6px}.library-tabs button.active{border-color:#7da936;color:#b7f34a;background:#202919}.download-list,.library-list{height:202px;overflow:auto;padding-right:4px}.empty-downloads,.empty-library{color:#84907e;font-size:12px;padding:20px 4px}.download-row,.library-row{border:1px solid #2d3827;background:#171e14;border-radius:9px;padding:8px 10px;margin-bottom:7px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px}.download-name,.library-title{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.download-name.risky{color:#f0bf68}.download-sub,.library-sub{font-size:10px;color:#84907e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.download-progress{height:5px;border-radius:5px;background:#283123;overflow:hidden;margin-top:5px}.download-progress span{display:block;height:100%;background:#b7f34a}.download-actions,.library-actions{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:5px}.download-actions button,.library-actions button{border:1px solid #344129;background:#192016;color:#dce7d2;border-radius:7px;padding:5px 8px;font-size:11px}.download-actions .cancel,.library-actions .remove{color:#e5a0a0}.download-state{font-size:10px;color:#a7b39e}.risk-tag{font-size:9px;border:1px solid #745f30;color:#f0bf68;border-radius:5px;padding:1px 4px;margin-left:5px}@media(max-width:860px){.brand{display:none}.tab{min-width:120px}.status{display:none}.download-head small,.library-head small{display:none}}</style></head><body><div class="bar"><div class="tabs-row"><div class="brand">happy coding =]</div><div class="tabs" id="tabs" aria-label="Abas"></div><button class="tab-tool" id="newTab" title="Nova aba (Ctrl+T)" aria-label="Nova aba">+</button><button class="tab-tool" id="restoreTab" title="Restaurar aba fechada (Ctrl+Shift+T)" aria-label="Restaurar aba fechada">↶</button></div><div class="nav"><button id="back" title="Voltar nesta aba (Alt+←)">←</button><button id="forward" title="Avançar nesta aba (Alt+→)">→</button><button id="reload" title="Atualizar esta aba (Ctrl+R)">↻</button><form id="go"><input id="address" value="happy://home" autocomplete="off" spellcheck="false" aria-label="Endereço ou pesquisa"></form><button class="bookmark-toggle" id="bookmarkBtn" title="Adicionar/remover favorito (Ctrl+D)" aria-label="Alternar favorito">☆</button><button id="libraryBtn" title="Favoritos e histórico" aria-label="Abrir favoritos e histórico">☷</button><button class="download-toggle" id="downloadsBtn" title="Downloads" aria-label="Abrir downloads">↓<span class="download-badge hidden" id="downloadBadge">0</span></button><button id="workspacesBtn" title="Meus projetos e conexões" aria-label="Abrir projetos e conexões">▱</button><button id="accountBtn" title="Conta e segurança" aria-label="Abrir conta e segurança">●</button><div clas
