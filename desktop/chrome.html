<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Coding</title><style>*{box-sizing:border-box}body{margin:0;background:#10140e;color:#eef5e6;font-family:Inter,system-ui,sans-serif;overflow:hidden}.bar{height:104px;padding:8px 10px 10px;border-bottom:1px solid #293221;display:flex;flex-direction:column;gap:8px}.tabs-row{display:flex;gap:7px;align-items:center;min-width:0}.brand{font-weight:800;color:#b7f34a;white-space:nowrap;padding:0 5px;font-size:12px}.tabs{display:flex;gap:6px;align-items:center;min-width:0;overflow:auto;scrollbar-width:none;flex:1}.tabs::-webkit-scrollbar{display:none}.tab{height:34px;min-width:145px;max-width:230px;background:#1b2217;border:1px solid #344129;border-radius:9px;color:#dce7d2;display:flex;align-items:center;overflow:hidden}.tab.active{border-color:#7da936;color:#b7f34a;background:#202919}.tab-main{border:0;background:transparent;color:inherit;min-width:0;flex:1;height:100%;padding:0 8px;text-align:left;display:flex;align-items:center;gap:7px}.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.loading{width:7px;height:7px;border-radius:50%;background:#b7f34a;opacity:.85;flex:none}.tab-close,.new-tab{border:0;background:transparent;color:#98a58f;height:100%;padding:0 9px;font-size:16px}.tab-close:hover,.new-tab:hover{color:#fff;background:#2b3526}.new-tab{height:34px;width:36px;border:1px solid #344129;border-radius:9px}.nav{display:flex;gap:7px;height:42px}.nav button{width:38px;border:1px solid #344129;background:#192016;color:#dce7d2;border-radius:8px}.nav button:disabled{opacity:.35}.nav form{flex:1;min-width:0}.nav input{width:100%;height:42px;border:1px solid #3a492d;border-radius:10px;background:#0d110c;color:#f0f6ea;padding:0 13px;outline:0}.nav input:focus{border-color:#b7f34a}.status{min-width:92px;max-width:180px;display:flex;align-items:center;justify-content:flex-end;color:#8f9d86;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:760px){.brand{display:none}.tab{min-width:120px}.status{display:none}}</style></head><body><div class="bar"><div class="tabs-row"><div class="brand">happy coding =]</div><div class="tabs" id="tabs" aria-label="Abas"></div><button class="new-tab" id="newTab" title="Nova aba (Ctrl+T)" aria-label="Nova aba">+</button></div><div class="nav"><button id="back" title="Voltar (Alt+←)">←</button><button id="forward" title="Avançar (Alt+→)">→</button><button id="reload" title="Atualizar (Ctrl+R)">↻</button><form id="go"><input id="address" value="happy://home" autocomplete="off" spellcheck="false" aria-label="Endereço ou pesquisa"></form><div class="status" id="status">HTTPS + SafeSearch</div></div></div><script src="chrome.js"></script></body></html>
